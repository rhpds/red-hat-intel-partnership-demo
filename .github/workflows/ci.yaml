name: CI - Stage Gate Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  stage-0-test-infrastructure:
    name: "Stage 0: Test Infrastructure"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stage 0 tests
        run: make test-stage-0

      - name: Check Stage 0 gate
        run: make check-stage-0

  stage-1-cpu-inference:
    name: "Stage 1: CPU Inference Path"
    runs-on: ubuntu-latest
    needs: stage-0-test-infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Run Stage 1 tests
        run: make test-stage-1

      - name: Check Stage 1 gate
        run: make check-stage-1

  lint-and-format:
    name: "Code Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linters
        run: make lint

  security-scan:
    name: "Security Scanning"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run security scans
        run: make security-scan

  ansible-lint:
    name: "Ansible Collection Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Lint collection role
        run: |
          cd ansible/collections/rhpds/intel_inference
          ansible-lint roles/

  agnosticv-lint:
    name: "AgnosticV Catalog Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint agnosticv YAML
        run: yamllint -d relaxed agnosticv/

      - name: Check required files
        run: |
          for dir in agnosticv/*/; do
            name=$(basename "$dir")
            echo "Checking $name..."
            [ -f "$dir/common.yaml" ] || { echo "ERROR: Missing common.yaml in $name"; exit 1; }
            [ -f "$dir/dev.yaml" ] || { echo "ERROR: Missing dev.yaml in $name"; exit 1; }
            grep -q '__meta__' "$dir/common.yaml" || { echo "ERROR: Missing __meta__ in $name/common.yaml"; exit 1; }
            grep -q 'asset_uuid' "$dir/common.yaml" || { echo "ERROR: Missing asset_uuid in $name/common.yaml"; exit 1; }
            echo "  OK: common.yaml, dev.yaml, __meta__, asset_uuid"
          done
          echo "All catalog items validated."
