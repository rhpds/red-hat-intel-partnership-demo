---
- name: Create namespace
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'namespace.yaml.j2') | from_yaml }}"

- name: Create secrets
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
  loop: "{{ lookup('template', 'secrets.yaml.j2') | from_yaml_all | list }}"
  no_log: true

- name: Create gateway routing ConfigMap
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'gateway-configmap.yaml.j2') | from_yaml }}"

- name: Deploy PostgreSQL
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
  loop: "{{ lookup('template', 'postgres.yaml.j2') | from_yaml_all | list }}"
  when: intel_rh_inference_deploy_database | bool

- name: Deploy Gateway
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
  loop: "{{ lookup('template', 'gateway.yaml.j2') | from_yaml_all | list }}"

- name: Deploy Frontend
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
  loop: "{{ lookup('template', 'frontend.yaml.j2') | from_yaml_all | list }}"

- name: Wait for PostgreSQL rollout
  ansible.builtin.command: >
    oc rollout status deployment/postgres
    -n {{ intel_rh_inference_namespace }} --timeout=120s
  changed_when: false
  when: intel_rh_inference_deploy_database | bool

- name: Wait for Gateway rollout
  ansible.builtin.command: >
    oc rollout status deployment/gateway
    -n {{ intel_rh_inference_namespace }} --timeout=120s
  changed_when: false

- name: Wait for Frontend rollout
  ansible.builtin.command: >
    oc rollout status deployment/frontend
    -n {{ intel_rh_inference_namespace }} --timeout=60s
  changed_when: false

- name: workload tasks complete
  ansible.builtin.debug:
    msg: "Intel-Red Hat AI Inference Platform deployed to {{ intel_rh_inference_namespace }}"
  when: not silent | bool
