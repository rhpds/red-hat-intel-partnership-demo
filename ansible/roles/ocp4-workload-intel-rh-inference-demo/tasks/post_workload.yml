---
- name: Get Gateway route
  ansible.builtin.command: >
    oc get route inference-gateway
    -n {{ intel_rh_inference_namespace }}
    -o jsonpath='{.spec.host}'
  changed_when: false
  register: r_gateway_route

- name: Get Frontend route
  ansible.builtin.command: >
    oc get route {{ intel_rh_inference_namespace }}
    -n {{ intel_rh_inference_namespace }}
    -o jsonpath='{.spec.host}'
  changed_when: false
  register: r_frontend_route

- name: Health check gateway
  ansible.builtin.uri:
    url: "https://{{ r_gateway_route.stdout }}/health"
    validate_certs: true
    return_content: true
  register: r_health
  retries: 5
  delay: 10
  until: r_health.status == 200

- name: Print access information
  ansible.builtin.debug:
    msg: |
      ════════════════════════════════════════════════════
      Intel-Red Hat AI Inference Platform — Deployed
      ════════════════════════════════════════════════════
      GUID:      {{ guid }}
      Namespace: {{ intel_rh_inference_namespace }}
      Frontend:  https://{{ r_frontend_route.stdout }}
      Gateway:   https://{{ r_gateway_route.stdout }}
      Health:    {{ r_health.json.status | default('unknown') }}
      ════════════════════════════════════════════════════
  when: not silent | bool

- name: post_workload tasks complete
  ansible.builtin.debug:
    msg: "Post-workload verification passed"
  when: not silent | bool
