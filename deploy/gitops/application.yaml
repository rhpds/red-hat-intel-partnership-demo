apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: intel-rh-demo
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/rhpds/red-hat-intel-partnership-demo.git
    targetRevision: main
    path: deploy/cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: intel-rh-demo
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
