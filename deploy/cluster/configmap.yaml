apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-routing-config
  namespace: intel-rh-demo
data:
  config.local.yaml: |
    ---
    # Routing config — LiteLLM proxy on Red Hat OpenShift AI
    # Falls back to local TinyLlama if LiteLLM is unreachable
    #
    # Confirmed working models:
    #   Xeon 6 (CPU):
    #     granite-2b-cpu           — IBM Granite 2B, fast classification/governance
    #     phi3-mini-cpu            — Phi-3 Mini 3.8B, reranking/completion
    #     qwen25-3b-cpu            — Qwen 2.5 3B, structured output
    #     nomic-embed-text-v1-5    — Nomic embeddings (768-dim)
    #   GPU:
    #     microsoft-phi-4          — Phi-4 14B, security analysis + structured output
    #     deepseek-r1-distill-qwen-14b — DeepSeek 14B, deep analysis

    backends:
      - name: litellm-cpu
        url: ${LITELLM_API_BASE}
        api_key: ${LITELLM_API_KEY}
        accelerator: xeon6
        capabilities:
          - completion
          - embeddings
          - classification
          - reranking
          - search
          - governance
          - policy
        cost_per_1k_tokens: 0.0004
        max_concurrent: 10

      - name: litellm-gpu
        url: ${LITELLM_API_BASE}
        api_key: ${LITELLM_API_KEY}
        accelerator: gaudi
        capabilities:
          - completion
          - batch_generation
          - governance
          - policy
        cost_per_1k_tokens: 0.001
        max_concurrent: 5

    routes:
      - task: embeddings
        backend: litellm-cpu
        reason: "nomic-embed-text-v1-5 on Xeon 6 — 768-dim embeddings"
        fallback: local

      - task: classification
        backend: litellm-cpu
        reason: "granite-2b-cpu on Xeon 6 OpenVINO — fast classification"
        fallback: local

      - task: search
        backend: litellm-cpu
        reason: "Semantic search via embeddings on Xeon 6"

      - task: reranking
        backend: litellm-cpu
        reason: "phi3-mini-cpu on Xeon 6 OpenVINO — cross-encoder reranking"
        fallback: local

      - task: completion
        conditions:
          - model_size_b: 4
            operator: "<="
            backend: litellm-cpu
            reason: "Small model (<=4B) on Xeon 6 OpenVINO — granite-2b, phi3-mini, qwen25-3b"
          - model_size_b: 4
            operator: ">"
            backend: litellm-gpu
            reason: "Large model (>4B) on GPU — microsoft-phi-4, deepseek-14b"
        default_backend: litellm-gpu
        reason: "Route by model size — small to Xeon 6, large to GPU"
        fallback: local

      - task: batch_generation
        backend: litellm-gpu
        reason: "Batch workloads on GPU — high throughput"
        fallback: local

      - task: governance
        backend: litellm-cpu
        reason: "granite-2b-cpu on Xeon 6 OpenVINO — fast governance evaluation"
        fallback: local

      - task: policy
        backend: litellm-cpu
        reason: "granite-2b-cpu on Xeon 6 OpenVINO — policy compliance check"
        fallback: local
