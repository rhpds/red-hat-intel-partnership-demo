---
# Routing config — dual-path through MAAS LiteLLM proxy
#
# CPU path (Xeon 6 + OpenVINO):
#   granite-2b-cpu          — 2B, classification/governance, 26 t/s
#   phi3-mini-cpu           — 3.8B, reranking/completion, 30 t/s
#   qwen25-3b-cpu           — 3B, structured output, 24 t/s
#   nomic-embed-text-v1-5   — embeddings (768-dim)
#   granite-2b-cpu      — 2B, fast classification, 19 t/s (vLLM)
#   phi3-mini-cpu   — 7B, code completion, 45 t/s (vLLM)
#
# GPU path:
#   microsoft-phi-4               — 14B, security analysis + structured output, 47 t/s
#   deepseek-r1-distill-qwen-14b  — 14B, deep analysis, 55 t/s
#   qwen3-14b                     — 14B, reasoning (think mode), 37 t/s
#   (previously: granite-3-2-8b on AWS GPU — removed, not on Intel hardware)

backends:
  - name: litellm-cpu
    url: ${LITELLM_API_BASE}
    api_key: ${LITELLM_API_KEY}
    accelerator: xeon6
    capabilities:
      - completion
      - embeddings
      - classification
      - reranking
      - search
      - governance
      - policy
    cost_per_1k_tokens: 0.0004
    max_concurrent: 10

  - name: litellm-gpu
    url: ${LITELLM_API_BASE}
    api_key: ${LITELLM_API_KEY}
    accelerator: gaudi
    capabilities:
      - completion
      - batch_generation
      - governance
      - policy
    cost_per_1k_tokens: 0.001
    max_concurrent: 10

routes:
  - task: embeddings
    backend: litellm-cpu
    reason: "nomic-embed-text-v1-5 on Xeon 6 — 768-dim embeddings"
    fallback: local

  - task: classification
    backend: litellm-cpu
    reason: "granite-2b-cpu on Xeon 6 OpenVINO — fast classification"
    fallback: local

  - task: search
    backend: litellm-cpu
    reason: "Semantic search via embeddings on Xeon 6"

  - task: reranking
    backend: litellm-cpu
    reason: "phi3-mini-cpu on Xeon 6 OpenVINO — cross-encoder reranking"
    fallback: local

  - task: completion
    conditions:
      - model_size_b: 4
        operator: "<="
        backend: litellm-cpu
        reason: "Small model (<=4B) on Xeon 6 OpenVINO — granite-2b, phi3-mini, qwen25-3b"
      - model_size_b: 4
        operator: ">"
        backend: litellm-gpu
        reason: "Large model (>4B) on GPU — microsoft-phi-4, deepseek-14b, qwen3-14b"
    default_backend: litellm-gpu
    reason: "Route by model size — small to Xeon 6 CPU, large to GPU"
    fallback: local

  - task: batch_generation
    backend: litellm-gpu
    reason: "Batch workloads on GPU — high throughput"
    fallback: local

  - task: governance
    backend: litellm-cpu
    reason: "granite-2b-cpu on Xeon 6 OpenVINO — fast governance evaluation"
    fallback: local

  - task: policy
    backend: litellm-cpu
    reason: "granite-2b-cpu on Xeon 6 OpenVINO — policy compliance check"
    fallback: local
