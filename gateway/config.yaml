---
# Inference Gateway Routing Configuration
#
# Dual-path routing through MAAS LiteLLM proxy:
#   CPU path (Xeon 6 + OpenVINO): small models, classification, embeddings
#   GPU path (Gaudi 3): large models, complex generation, batch workloads
#
# For direct cluster endpoints, see config.direct.yaml.

backends:
  - name: maas-cpu
    url: ${LITELLM_API_BASE:-https://litellm-prod.apps.maas.redhatworkshops.io}
    api_key: ${LITELLM_API_KEY}
    accelerator: xeon6
    capabilities:
      - completion
      - embeddings
      - classification
      - reranking
      - search
    cost_per_1k_tokens: 0.0004
    max_concurrent: 10

  - name: maas-gpu
    url: ${LITELLM_API_BASE:-https://litellm-prod.apps.maas.redhatworkshops.io}
    api_key: ${LITELLM_API_KEY}
    accelerator: gaudi
    capabilities:
      - completion
      - batch_generation
      - governance
      - policy
    cost_per_1k_tokens: 0.001
    max_concurrent: 10

routes:
  - task: embeddings
    backend: maas-cpu
    reason: "nomic-embed-text-v1-5 on Xeon 6 — 768-dim embeddings with AMX acceleration"
    fallback: local

  - task: classification
    backend: maas-cpu
    reason: "granite-2b-cpu on Xeon 6 OpenVINO — fast, low-cost classification"
    fallback: local

  - task: reranking
    backend: maas-cpu
    reason: "phi3-mini-cpu on Xeon 6 OpenVINO — cross-encoder reranking"
    fallback: local

  - task: search
    backend: maas-cpu
    reason: "Semantic search via embeddings on Xeon 6"

  - task: completion
    conditions:
      - model_size_b: 4
        operator: "<="
        backend: maas-cpu
        reason: "Small model (<=4B) on Xeon 6 OpenVINO — granite-2b, phi3-mini, qwen25-3b"
      - model_size_b: 4
        operator: ">"
        backend: maas-gpu
        reason: "Large model (>4B) on Gaudi 3 — llama-scout-17b, deepseek-14b, phi-4"
    default_backend: maas-gpu
    reason: "Route by model size — small to Xeon 6 CPU, large to Gaudi 3 GPU"
    fallback: local

  - task: batch_generation
    backend: maas-gpu
    reason: "Batch workloads on Gaudi 3 — high throughput with HBM bandwidth"
    fallback: local

  - task: governance
    backend: maas-cpu
    reason: "granite-2b-cpu on Xeon 6 OpenVINO — fast governance evaluation"
    fallback: local

  - task: policy
    backend: maas-cpu
    reason: "granite-2b-cpu on Xeon 6 OpenVINO — policy compliance check"
    fallback: local
