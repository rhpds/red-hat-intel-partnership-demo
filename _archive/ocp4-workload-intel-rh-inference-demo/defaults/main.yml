---
become_override: false
ocp_username: opentlc-mgr
silent: false

# Namespace
intel_rh_inference_namespace: "intel-rh-demo-{{ guid }}"

# Container images
intel_rh_inference_gateway_image: "quay.io/redhat-gpte/intel-inference-gateway:latest"
intel_rh_inference_frontend_image: "quay.io/redhat-gpte/intel-inference-frontend:latest"
intel_rh_inference_postgres_image: "registry.redhat.io/rhel9/postgresql-15:latest"

# Replicas
intel_rh_inference_gateway_replicas: 2
intel_rh_inference_frontend_replicas: 1

# Gateway resources
intel_rh_inference_gateway_cpu_request: "500m"
intel_rh_inference_gateway_cpu_limit: "1"
intel_rh_inference_gateway_memory_request: "256Mi"
intel_rh_inference_gateway_memory_limit: "512Mi"

# Frontend resources
intel_rh_inference_frontend_cpu_request: "100m"
intel_rh_inference_frontend_cpu_limit: "500m"
intel_rh_inference_frontend_memory_request: "64Mi"
intel_rh_inference_frontend_memory_limit: "128Mi"

# Database
intel_rh_inference_deploy_database: true
intel_rh_inference_postgres_storage: "10Gi"
intel_rh_inference_postgres_user: "gateway"
# intel_rh_inference_postgres_password — REQUIRED, no default
intel_rh_inference_postgres_cpu_request: "250m"
intel_rh_inference_postgres_cpu_limit: "1"
intel_rh_inference_postgres_memory_request: "256Mi"
intel_rh_inference_postgres_memory_limit: "512Mi"

# MAAS / LiteLLM inference backend
intel_rh_inference_litellm_api_base: "https://litellm-prod.apps.maas.redhatworkshops.io"
# intel_rh_inference_litellm_api_key — REQUIRED, no default

# Gateway configuration
intel_rh_inference_cors_origins: ""
intel_rh_inference_rate_limit_rpm: 85
intel_rh_inference_local_fallback: false
