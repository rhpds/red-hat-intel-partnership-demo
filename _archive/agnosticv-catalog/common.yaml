# AgnosticV Catalog Entry — Intel-Red Hat AI Inference Demo
#
# This is a REFERENCE for what goes into the shared agnosticv repo.
# Coordinate with Ashok/Tony on the exact account path.

__meta__:
  catalog:
    display_name: "Intel-Red Hat AI Inference Platform"
    description: >
      Multi-tenant inference gateway with dual-path routing across
      Intel Xeon 6 (CPU/OpenVINO) and Gaudi 3 (GPU) via MAAS LiteLLM.
    labels:
      - intel
      - ai-inference
      - gaudi
      - xeon
      - openvino

# Workload role reference (consumed by ocp-workloads config)
ocp_workload: ocp4-workload-intel-rh-inference-demo
ACTION: create

# Base configuration
intel_rh_inference_gateway_image: "quay.io/rh-ee-jkershaw/inference-gateway:latest"
intel_rh_inference_frontend_image: "quay.io/rh-ee-jkershaw/inference-frontend:latest"
intel_rh_inference_postgres_image: "registry.redhat.io/rhel9/postgresql-15:latest"
intel_rh_inference_litellm_api_base: "https://litellm-prod.apps.maas.redhatworkshops.io"
intel_rh_inference_deploy_database: true
