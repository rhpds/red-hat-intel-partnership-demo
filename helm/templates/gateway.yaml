apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: inference-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: gateway-config
          env:
            - name: CONFIG_PATH
              value: /config/config.local.yaml
            - name: CORS_ORIGINS
              value: {{ .Values.gateway.corsOrigins | quote }}
            - name: RATE_LIMIT_RPM
              value: {{ .Values.gateway.rateLimitRpm | quote }}
            - name: LOCAL_FALLBACK_ENABLED
              value: {{ .Values.gateway.localFallback | quote }}
          {{- if .Values.semanticRouter.enabled }}
            - name: VLLM_SR_URL
              value: "http://semantic-router:8899"
          {{- end }}
          {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          {{- end }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: routing-config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: routing-config
          configMap:
            name: gateway-routing-config
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: inference-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: inference-gateway
  namespace: {{ .Values.namespace }}
spec:
  to:
    kind: Service
    name: inference-gateway
  port:
    targetPort: http
  tls:
    termination: edge
