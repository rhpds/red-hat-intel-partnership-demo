apiVersion: v1
kind: Secret
metadata:
  name: gateway-config
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  LITELLM_API_KEY: {{ .Values.litellm.apiKey | quote }}
  LITELLM_API_BASE: {{ .Values.litellm.apiBase | quote }}
---
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRESQL_USER: {{ .Values.postgres.user | quote }}
  POSTGRESQL_PASSWORD: {{ required "postgres.password is required" .Values.postgres.password | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres.{{ .Values.namespace }}.svc:5432/gateway"
{{- end }}
