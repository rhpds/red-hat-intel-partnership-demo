---
# Secret variables for RHDP vault.
#
# These must be configured in the agnosticv secret vars for each environment.
# They are injected by Babylon at provision time and are NOT stored in git.
#
# To configure, add these to the appropriate agnosticv secret vars file
# or set them in the Babylon vault for this asset.

# REQUIRED: MAAS LiteLLM API key for inference backend access.
# Get this from the MAAS admin console or contact the MAAS team.
litellm_api_key: "CHANGE-ME"

# OPTIONAL: Override the MAAS endpoint (defaults to common.yaml value).
# litellm_api_base: "https://maas-rhdp.apps.maas.redhatworkshops.io"
