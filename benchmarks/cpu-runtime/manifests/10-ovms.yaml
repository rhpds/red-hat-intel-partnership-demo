apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovms-benchmark
  namespace: intel-cpu-runtime-benchmark
  labels:
    app: ovms-benchmark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ovms-benchmark
  template:
    metadata:
      labels:
        app: ovms-benchmark
        benchmark-runtime: ovms
    spec:
      nodeSelector:
        kubernetes.io/hostname: ocp-rac-maas-worker01
      containers:
        - name: ovms
          image: openvino/model_server:2025.3
          args:
            - --source_model
            - OpenVINO/Phi-3.5-mini-instruct-int4-ov
            - --model_repository_path
            - /models/ovms
            - --model_name
            - phi35-mini-int4
            - --target_device
            - CPU
            - --task
            - text_generation
            - --rest_port
            - "8000"
            - --cache_size
            - "64"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "64"
              memory: 128Gi
            limits:
              cpu: "64"
              memory: 128Gi
          volumeMounts:
            - name: model-cache
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 120
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: cpu-runtime-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: ovms-benchmark
  namespace: intel-cpu-runtime-benchmark
spec:
  selector:
    app: ovms-benchmark
  ports:
    - name: http
      port: 8000
      targetPort: http
